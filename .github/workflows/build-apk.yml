name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Installable APK
        run: gradle assembleDebug --stacktrace

      - name: Rename APK output
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk "output/Tasbih-v1.0.0.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tasbih-APK
          path: output/*.apk

      - name: Publish GitHub Release with APK
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: "দৈনিক আমল ও মোনাজাত v1.0.0 (Build ${{ github.run_number }})"
          body: |
            Automated Android APK build for https://amarapperjonno-cpu.github.io/tasbih/
            Download the `.apk` file below directly on your Android phone and tap to install.
          files: output/*.apk
